[project]
name = "artifact-service"
version = "0.2.0"
description = "Artifact Registry Service - Secure storage and retrieval of project artifacts"
authors = [
    {name = "George Dekker"}
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.44.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j fixed in 2.14.2
    "sqlalchemy>=2.0.49",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13.3",
    "psycopg[binary,pool]>=3.3.0",
    "python-multipart>=0.0.31",  # CVE-2026-53537..53540 fixed in 0.0.31
    "PyJWT[crypto]>=2.15.1",
    "cryptography>=50.0.0",  # CVE-2026-69247..69249 fixed in 50.0.0
    "python-keycloak>=7.1.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "structlog>=25.5.0",
    "prometheus-client>=0.21.0",
    "cachetools>=5.3.0",
    "opentelemetry-api>=1.45.1",  # CVE-2026-114603 fixed in 1.45.1
    "opentelemetry-sdk>=1.40.0",
    "opentelemetry-exporter-otlp-proto-http>=1.40.0",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "opentelemetry-instrumentation-httpx>=0.61b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.61b0",
    "urllib3>=2.8.0",  # CVE-2026-44431, CVE-2026-44432 fixed in 2.7.0
    "werkzeug>=3.1.9",
    # Document render (DOC-1): markdown -> sanitised HTML -> PDF. Exact pins on
    # purpose: the renderer's output is cached by RENDER_VERSION, so a silent
    # minor bump of any of these would change bytes behind a cache key.
    "markdown-it-py==4.2.0",
    "nh3==0.3.7",
    "weasyprint==70.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock",
    "pytest-timeout>=2.3.1",
    "ruff>=0.15",
    "pre-commit>=4.0.1",
    "detect-secrets>=1.5.0",
]
contract = [
    "schemathesis>=3.36.0",
    "tavern>=2.12.1",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock",
    "pytest-timeout>=2.3.1",
    "ruff>=0.15",
    "ty>=0.0.29",
    "pre-commit>=4.0.1",
    "detect-secrets>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

# Pin the rule set explicitly. Ruff's DEFAULT select ("E4","E7","E9","F") is not
# a stable contract: 0.16 widened it, and this repo — which declares
# `ruff>=0.15` unbounded — went from "All checks passed" on 0.15.17 to 132
# findings on 0.16.6 with ZERO source changes. An unpinned select means the
# lint gate is defined by whatever ruff resolved that week. Set matches the
# fleet majority (38 of 71 python repos under Movies/ declare exactly this
# select; all 38 also ignore E501, which the formatter owns).
[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]
ignore = ["E501"]

# These test names deliberately embed the identifier under test verbatim — the
# wire header `X-Subject-Id`, the env var `DEFAULT_TENANT_ID`, the literal
# tenant name `Bearer`. Lowercasing them to satisfy pep8-naming would delete
# the thing the name is asserting about.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
unresolved-import = "error"

[[tool.ty.overrides]]
include = ["tests/contract/"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (may need services)",
    "contract: Contract tests (OpenAPI validation)",
    "e2e: End-to-end tests (require running service)",
    "security: Security-focused tests",
    "slow: Tests that take longer to run",
]
addopts = "-v --tb=short -m 'not integration and not e2e'"

[tool.coverage.run]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 80
